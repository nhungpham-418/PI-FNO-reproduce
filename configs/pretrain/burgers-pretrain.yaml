data:
  name: Burgers
  datapath: '../data/burgers_pino_new.mat'
  total_num: 1000
  offset: 0
  n_sample: 800
  nx: 128
  nt: 100
  sub: 1
  sub_t: 1 

model:
  layers: [16, 16, 24, 32] #[64, 64, 64, 64] #[100, 100, 100, 100, 100] #[16, 24, 24, 32, 32]
  modes1: [8, 6, 4] #[16, 12, 9, 9] #[32, 24, 15, 9, 9]
  modes2: [8, 6, 4] #[16, 12, 9, 9] #[32, 24, 15, 9, 9]
  fc_dim: 32 #64 #128
  act: gelu #tanh
  num_pad: 4

train:
  batchsize: 20
  epochs: 500
  milestones: [150, 300, 450]
  base_lr: 0.0005
  scheduler_gamma: 0.5
  ic_loss: 0.0
  f_loss: 0
  xy_loss: 1.0
  save_dir: 'burgers-FDM'
  save_name: 'burgers-invisicd-data-0-pde-1-ic-100-4-32-mode-8-data.pt'

log:
  project: PINO-burgers-pretrain
  group: gelu-eqn
  entity: hzzheng-pino

